<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mind - Programare Online</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1a5f7a; --primary-dark: #134b61; --primary-light: #e8f4f8;
      --accent: #57c5b6; --accent-light: #e6f7f5; --text: #2d3748;
      --text-light: #718096; --bg: #ffffff; --border: #e2e8f0;
      --disabled: #cbd5e0; --error: #e53e3e; --error-light: #fed7d7;
      --success: #38a169; --success-light: #c6f6d5;
      --warning: #dd6b20; --warning-light: #feebc8;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.4; }
    .app-container { max-width: 380px; min-height: 400px; padding: 16px; margin: 0 auto; }
    .progress-bar { display: flex; align-items: center; gap: 4px; margin-bottom: 16px; }
    .progress-step { flex: 1; height: 3px; background: var(--border); border-radius: 2px; transition: background 0.3s; }
    .progress-step.active { background: var(--primary); }
    .progress-step.completed { background: var(--accent); }
    .section { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .section-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; position: relative; min-height: 32px; }
    .section-header > .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
    .section-header > div { text-align: center; }
    .section-title { font-size: 15px; font-weight: 600; color: var(--primary); }
    .section-subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .back-btn { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-light); transition: all 0.15s; flex-shrink: 0; }
    .back-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 18px 14px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; background: var(--bg); }
    .option-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .option-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .option-card.primary-option { border-color: var(--primary); background: var(--primary-light); }
    .option-card.primary-option:hover { background: var(--primary); color: white; }
    .option-card.primary-option:hover .option-title, .option-card.primary-option:hover .option-desc { color: white; }
    .option-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .option-card.primary-option .option-icon { background: var(--primary); }
    .option-card.primary-option:hover .option-icon { background: rgba(255,255,255,0.2); }
    .option-content { flex: 1; }
    .option-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .option-desc { font-size: 11px; color: var(--text-light); }
    .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option-card-small { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 12px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; background: var(--bg); text-align: center; }
    .option-card-small:hover { border-color: var(--primary); background: var(--primary-light); }
    .option-card-small.selected { border-color: var(--primary); background: var(--primary-light); }
    .option-card-small .option-icon { width: 52px; height: 52px; font-size: 26px; }
    .reasons-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .reason-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .reason-item:hover { border-color: var(--primary); background: var(--primary-light); }
    .reason-item.selected { border-color: var(--primary); background: var(--primary-light); }
    .reason-checkbox { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .reason-item.selected .reason-checkbox { background: var(--primary); border-color: var(--primary); color: white; }
    .reason-label { font-size: 13px; font-weight: 500; }
    .other-input { flex: 1; border: none; background: transparent; font-size: 13px; outline: none; padding: 0; }
    .other-input::placeholder { color: var(--text-light); }
    .search-container { margin-bottom: 14px; }
    .search-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); transition: border-color 0.2s; }
    .search-box:focus-within { border-color: var(--primary); }
    .search-box input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; color: var(--text); }
    .search-box input::placeholder { color: var(--text-light); }
    .search-icon { color: var(--text-light); }
    .doctors-list { display: flex; flex-direction: column; gap: 10px; max-height: 340px; overflow-y: auto; }
    .doctor-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 14px 12px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; }
    .doctor-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .doctor-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: var(--primary); overflow: hidden; flex-shrink: 0; }
    .doctor-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .doctor-info { flex: 1; min-width: 0; }
    .doctor-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .doctor-specialty { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
    .doctor-meta { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .doctor-slots { font-size: 10px; color: var(--accent); font-weight: 600; }
    .doctor-languages { font-size: 10px; color: var(--text-light); }
    .selected-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 12px; background: var(--primary-light); border-radius: 10px; margin-bottom: 14px; }
    .selected-badge img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .selected-badge .initials { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
    .selected-badge .info { flex: 1; }
    .selected-badge .name { font-size: 13px; font-weight: 600; color: var(--primary); }
    .selected-badge .detail { font-size: 11px; color: var(--text-light); }
    .calendar-container { background: var(--bg); border-radius: 12px; border: 1px solid var(--border); padding: 14px; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .month-title { font-weight: 600; font-size: 15px; color: var(--primary); }
    .calendar-nav { display: flex; gap: 6px; }
    .nav-btn { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); transition: all 0.15s; }
    .nav-btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 6px; }
    .weekday { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-light); padding: 6px 0; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.15s; border: 2px solid transparent; }
    .day.empty { cursor: default; }
    .day.past, .day.unavailable { color: var(--disabled); cursor: not-allowed; }
    .day.available { background: var(--accent-light); color: var(--primary); font-weight: 500; }
    .day.available:hover { background: var(--primary); color: white; }
    .day.selected { background: var(--primary); color: white; font-weight: 600; }
    .day.today { border-color: var(--accent); }
    .time-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .time-header { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 10px; }
    .time-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-height: 220px; overflow-y: auto; }
    .time-slot { width: 72px; padding: 12px 6px; text-align: center; font-size: 13px; font-weight: 500; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; background: var(--bg); position: relative; }
    .time-slot:hover { border-color: var(--primary); background: var(--primary-light); }
    .time-slot.selected { background: var(--primary); color: white; border-color: var(--primary); }
    .form-section { display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: center; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text); }
    .form-label .required { color: var(--error); }
    .form-label .optional { color: var(--text-light); font-weight: 400; }
    .form-input { padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; text-align: left; }
    .form-input:focus { border-color: var(--primary); }
    .form-input.error { border-color: var(--error); }
    .form-hint { font-size: 11px; color: var(--text-light); }
    .form-error { font-size: 11px; color: var(--error); }
    .phone-status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-top: 6px; }
    .phone-status.checking { background: var(--primary-light); color: var(--primary); }
    .phone-status.success { background: var(--success-light); color: var(--success); }
    .phone-status.error { background: var(--error-light); color: var(--error); }
    .phone-status.warning { background: var(--warning-light); color: var(--warning); }
    .summary-card { background: var(--primary-light); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .summary-row { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px 0; border-bottom: 1px solid rgba(26, 95, 122, 0.1); }
    .summary-row:last-child { border-bottom: none; }
    .summary-icon { width: 20px; text-align: center; flex-shrink: 0; }
    .summary-label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
    .summary-value { font-size: 13px; font-weight: 600; color: var(--text); }
    .summary-price { background: var(--accent); color: white; padding: 12px 16px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; margin-top: 12px; }
    .summary-price .label { font-size: 13px; }
    .summary-price .amount { font-size: 18px; font-weight: 700; }
    .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: var(--disabled); cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 12px; background: var(--bg); color: var(--primary); border: 2px solid var(--primary); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
    .btn-secondary:hover { background: var(--primary-light); }
    .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-light); }
    .success-container { text-align: center; padding: 40px 20px; }
    .success-icon { width: 80px; height: 80px; background: var(--success-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
    .success-title { font-size: 20px; font-weight: 700; color: var(--success); margin-bottom: 12px; }
    .success-message { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 24px; }
    .error-container { text-align: center; padding: 40px 20px; }
    .error-icon { width: 80px; height: 80px; background: var(--error-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
    .error-title { font-size: 20px; font-weight: 700; color: var(--error); margin-bottom: 12px; }
    .error-message { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 24px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <div class="loading-container">
      <div class="spinner"></div>
      <div class="loading-text">O secundă...</div>
    </div>
  </div>
  <script>
    const CONFIG = { availabilityWebhook: 'https://hook.eu1.make.com/6nmbzcxoqlfy2gfaagvtfylsq3yiptfh', bookingWebhook: 'https://hook.eu1.make.com/7u9e5kwut77u7bekm8poglrmmlw62cym', phoneCheckWebhook: '' };
    const MONTHS_RO = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
    const DAYS_RO = ['Lu','Ma','Mi','Jo','Vi','Sâ','Du'];
    const DAY_NAMES = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
    function parseDateString(dateStr) { const [y,m,d] = dateStr.split('-').map(Number); return new Date(y, m-1, d); }
    const SERVICE_TYPES = { 'psihoterapie-adult':{label:'Psihoterapie individuală',airtable:'Psihoterapie adulti',api:'Psihoterapie adulti'}, 'psihoterapie-cuplu':{label:'Psihoterapie de cuplu',airtable:'Psihoterapie cuplu',api:'Psihoterapie cuplu'}, 'psihiatrie-adult':{label:'Psihiatrie',airtable:'Psihiatrie adulti',api:'Psihiatrie adulti'}, 'psihoterapie-copil':{label:'Psihoterapie copii',airtable:'Psihoterapie copii',api:'Psihoterapie copii'}, 'psihoterapie-adolescent':{label:'Psihoterapie adolescenți',airtable:'Psihoterapie adolescenti',api:'Psihoterapie adolescenti'}, 'psihiatrie-copil':{label:'Psihiatrie pediatrică',airtable:'Psihiatrie pediatrica',api:'Psihiatrie pediatrica'}, 'logopedie':{label:'Logopedie',airtable:'Logopedie',api:'Logopedie'} };
    const LOCATIONS = { '1':{name:'Cotroceni',address:'Strada Ana Davila 13'}, '2':{name:'Primăverii',address:'Strada Pictor Ion Negulici 4'} };
    const AGE_GROUPS_ADULT = [{key:'18-30',label:'18 - 30 ani',min:18,max:30},{key:'30+',label:'Peste 30 ani',min:31,max:99}];
    const AGE_GROUPS_CHILD = [{key:'3-13',label:'3 - 13 ani',min:3,max:13},{key:'14-18',label:'14 - 18 ani',min:14,max:18}];
    const AGE_GROUPS_LOGOPEDIE = [{key:'3-14',label:'3 - 14 ani',min:3,max:14}];
    const AGE_GROUPS_PSIHIATRIE_COPIL = [{key:'0-18',label:'0 - 18 ani',min:0,max:18}];
    const REASONS_ADULT = ['Anxietate / Atacuri de panică','Depresie','Burnout / Stres','Traume emoționale','Relații / Cuplu / Familie','Dezvoltare personală'];
    const REASONS_CHILD = ['Anxietate / Stres','Depresie / Stări emoționale','Tulburări de comportament','Traume emoționale','ADHD / TOC','Tulburări de personalitate'];
    const REASONS_LOGOPEDIE = ['Dificultăți de vorbire/pronunție','Bâlbâială','Dificultăți de auz','Dislexie','Întârzieri în dezvoltare'];
    const SESSION_DURATION = 50;
    const BUFFER_MIN = 10;
    const MIN_SPACING_MIN = 30;
    const HEAD_SLOTS = 2;
    const TAIL_SLOTS = 1;

    function normalizeDoctor(d) { if (d.DoctorId !== undefined) return d; return { DoctorId:d.doctor_id, Name:d.name, Active:d.active, SpecialtyType:d.specialty_type||[], Photo:d.photo, ShortBio:d.short_bio, LocationIds:d.location_ids, AgeGroupMin:d.age_group_min, AgeGroupMax:d.age_group_max, DoctorType:d.doctor_type, ProblemTags:d.problem_tags||[], Languages:d.languages||[] }; }
    function extractDoctors(raw) { if (!raw||!Array.isArray(raw)) return []; if (raw.length>0&&raw[0]&&raw[0].data) return raw.flatMap(i=>i.data||[]).map(normalizeDoctor); return raw.map(normalizeDoctor); }
    function calculatePrice(st,dt,lang) { const e=lang==='Engleza'; if(st==='psihoterapie-adult'||st==='psihoterapie-copil'||st==='psihoterapie-adolescent') return e?320:290; if(st==='psihoterapie-cuplu') return e?380:320; if(st==='psihiatrie-adult'||st==='psihiatrie-copil') return dt==='Primar'?(e?410:350):(e?360:310); if(st==='logopedie') return e?290:190; return 290; }

    let state = { step:'loading', loading:true, bookingInProgress:false, slotsLoaded:false, allSlots:[], allDoctors:[], filteredDoctors:[], flowType:null, searchQuery:'', patientType:null, serviceType:null, selectedAgeGroup:null, childAge:null, sessionFormat:null, locationId:null, language:null, selectedReason:null, otherReason:'', selectedDoctor:null, selectedDate:null, selectedTime:null, showAllSlots:false, patientName:'', patientPhone:'', patientEmail:'', phoneChecked:false, phoneCanBook:true, phoneCheckLoading:false, currentMonth:new Date(), appointmentId:null, errorMessage:null, errorType:null };

    async function init() { const p=new URLSearchParams(window.location.search); if(p.get('availabilityWebhook'))CONFIG.availabilityWebhook=p.get('availabilityWebhook'); if(p.get('bookingWebhook'))CONFIG.bookingWebhook=p.get('bookingWebhook'); if(p.get('phoneCheckWebhook'))CONFIG.phoneCheckWebhook=p.get('phoneCheckWebhook'); if(window.bookingConfig)Object.assign(CONFIG,window.bookingConfig); await fetchAllData(); }

    async function fetchAllData() {
      state.loading=true; state.step='loading'; render();
      try {
        const supabaseUrl='https://hxqxyeukqipknxdhrdoa.supabase.co/rest/v1/doctors?select=*&active=eq.true';
        const supabaseKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cXh5ZXVrcWlwa254ZGhyZG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MDkyNzMsImV4cCI6MjA5MDM4NTI3M30.uzZsvmeuCL8vJoOzAUa-SwNmpohfJ2uJ4xvSumaEpGg';
        const docResp=await fetch(supabaseUrl,{headers:{'apikey':supabaseKey,'Authorization':'Bearer '+supabaseKey}});
        state.allDoctors=(await docResp.json()).map(normalizeDoctor);
        console.log('Doctors loaded:',state.allDoctors.length);
        state.loading=false; state.step='start'; render();
        const [d1,d2]=await Promise.all([fetchAvailabilityChunked('1'),fetchAvailabilityChunked('2')]);
        state.allSlots=[...(d1.slots||[]).map(s=>({...s,LocationId:1})),...(d2.slots||[]).map(s=>({...s,LocationId:2}))];
        state.slotsLoaded=true; console.log('Slots loaded:',state.allSlots.length); render();
      } catch(err) { console.error('Init error:',err); if(!state.allDoctors.length){state.loading=false;state.step='error';state.errorMessage='Nu am putut încărca datele. Te rugăm reîncarcă pagina.';render();} }
    }

    async function fetchAvailability(locId,dateStart,dateEnd) { const r=await fetch(CONFIG.availabilityWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({locationId:locId,dateStart,dateEnd,serviceType:'Psihoterapie adulti'})}); if(!r.ok)throw new Error('Network error'); return await r.json(); }
    async function fetchAvailabilityChunked(locId) { const today=new Date(),d30=new Date(today.getTime()+30*86400000),d60=new Date(today.getTime()+60*86400000); const [a,b]=await Promise.all([fetchAvailability(locId,formatDateISO(today),formatDateISO(d30)),fetchAvailability(locId,formatDateISO(d30),formatDateISO(d60))]); return { slots: [...(a.slots||[]),...(b.slots||[])] }; }
    function formatDateISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function parseSlotDateTime(s) { return new Date(s); }
    function getSlotDate(s) { return s.StartDateTime.substring(0,10); }
    function getInitials(n) { return n?.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase()||'?'; }
    const MIN_BOOKING_HOURS=48;
    function getDoctorSlots(did,lid=null) { const mt=new Date(Date.now()+MIN_BOOKING_HOURS*3600000); return state.allSlots.filter(s=>s.DoctorId===did&&(!lid||s.LocationId===parseInt(lid))&&parseSlotDateTime(s.StartDateTime)>=mt); }
    function getDoctorAvailableDates(did, lid=null) {
      const d = new Set();
      const dates = new Set(getDoctorSlots(did, lid).map(getSlotDate));
      dates.forEach(ds => {
        if (getTimeSlotsForDoctorDate(did, ds, lid, true).length > 0) d.add(ds);
      });
      return d;
    }
    function generateTimeSlots(raw) {
      const mt = Date.now() + MIN_BOOKING_HOURS*3600000;
      const dur = SESSION_DURATION*60000;
      const step = (SESSION_DURATION + BUFFER_MIN)*60000;
      const byRange = [];
      raw.forEach(slot => {
        const st = parseSlotDateTime(slot.StartDateTime).getTime();
        const en = parseSlotDateTime(slot.EndDateTime).getTime();
        const fwd = [], bwd = [];
        for (let c = st; c + dur <= en; c += step) fwd.push(c);
        for (let c = en - dur; c >= st; c -= step) bwd.push(c);

    function renderCalendar(){const doc=state.selectedDoctor;if(!state.slotsLoaded)return `<div class="section"><div class="section-header"><button class="back-btn" onclick="goBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="section-title">Alege data</div></div><div class="selected-badge">${doc.Photo?`<img src="${doc.Photo}" alt="${doc.Name}">`:`<div class="initials">${getInitials(doc.Name)}</div>`}<div class="info"><div class="name">${doc.Name}</div><div class="detail">${doc.ShortBio||''}</div></div></div><div class="loading-container"><div class="spinner"></div><div class="loading-text">Se încarcă disponibilitățile...</div></div></div>`;const loc=state.sessionFormat==='online'?null:state.locationId,ad=getDoctorAvailableDates(doc.DoctorId,loc),y=state.currentMonth.getFullYear(),mo=state.currentMonth.getMonth(),fd=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),td=new Date();td.setHours(0,0,0,0);const cp=mo>td.getMonth()||y>td.getFullYear();let dh='';for(let i=0;i<fd;i++)dh+='<div class="day empty"></div>';for(let d=1;d<=dim;d++){const dt=new Date(y,mo,d),ds=formatDateISO(dt),ip=dt<td,it=dt.getTime()===td.getTime(),ia=ad.has(ds),is=state.selectedDate===ds;let c='day';if(ip)c+=' past';else if(ia)c+=' available';else c+=' unavailable';if(it)c+=' today';if(is)c+=' selected';dh+=`<div class="${c}" ${!ip&&ia?`onclick="selectDate('${ds}')"`:''} >${d}</div>`;}return `<div class="section"><div class="section-header"><button class="back-btn" onclick="goBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="section-title">Alege data</div></div><div class="selected-badge">${doc.Photo?`<img src="${doc.Photo}" alt="${doc.Name}">`:`<div class="initials">${getInitials(doc.Name)}</div>`}<div class="info"><div class="name">${doc.Name}</div><div class="detail">${doc.ShortBio||''}</div></div></div><div class="calendar-container"><div class="calendar-header"><span class="month-title">${MONTHS_RO[mo]} ${y}</span><div class="calendar-nav"><button class="nav-btn" onclick="prevMonth()" ${!cp?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><button class="nav-btn" onclick="nextMonth()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button></div></div><div class="weekdays">${DAYS_RO.map(d=>`<div class="weekday">${d}</div>`).join('')}</div><div class="days-grid">${dh}</div></div></div>`;}
    function renderTime(){const doc=state.selectedDoctor,loc=state.sessionFormat==='online'?null:state.locationId,ts=getTimeSlotsForDoctorDate(doc.DoctorId,state.selectedDate,loc,state.showAllSlots),dt=parseDateString(state.selectedDate),dd=`${DAY_NAMES[dt.getDay()]}, ${dt.getDate()} ${MONTHS_RO[dt.getMonth()]}`;const slotHTML=s=>`<div class="time-slot ${state.selectedTime?.time===s.time?'selected':''}" onclick="selectTime('${s.time}','${s.startDateTime}',${s.locationId})">${s.time}</div>`;const body=ts.length===0?`<div class="empty-state"><div class="icon">📅</div><div>Nu sunt intervale disponibile în această zi. Te rugăm alege altă dată.</div></div>`:`<div class="time-grid">${ts.map(slotHTML).join('')}</div><div style="text-align:center;margin-top:12px;"><button type="button" onclick="toggleAllSlots()" style="background:none;border:none;padding:4px 8px;font-size:13px;color:#6b7280;text-decoration:underline;cursor:pointer;font-family:inherit;">${state.showAllSlots?'Vezi orele recomandate':'Vezi toate orele disponibile'}</button></div>`;return `<div class="section"><div class="section-header"><button class="back-btn" onclick="goBackFromTime()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="section-title">Alege ora</div></div><div class="selected-badge" style="justify-content:center;text-align:center;"><div class="info"><div class="name" style="font-size:15px;">${doc.Name}</div><div class="detail" style="font-size:13px;">📅 ${dd}</div></div></div>${body}${state.selectedTime?`<button class="btn-primary" style="margin-top:16px;" onclick="goToStep('patient-data')">Continuă</button>`:''}</div>`;}
    function renderPatientData(){const ic=state.patientType==='child',nl=ic?'Numele complet al copilului':'Nume complet',nh=ic?'<div class="form-hint">Prenume și nume (ex: Maria Popescu)</div>':'<div class="form-hint">Prenume și nume (ex: Ion Popescu)</div>';return `<div class="section"><div class="section-header"><button class="back-btn" onclick="goBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="section-title">Datele tale</div></div><div class="form-section"><div class="form-group"><label class="form-label">${nl} <span class="required">*</span></label><input type="text" id="patient-name" class="form-input" placeholder="${ic?'ex: Maria Popescu':'ex: Ion Popescu'}" value="${state.patientName}" oninput="updatePatientButton()">${nh}<div id="name-hint"></div></div><div class="form-group"><label class="form-label">Număr de telefon <span class="required">*</span></label><input type="tel" id="patient-phone" class="form-input" placeholder="ex: 0751234567" value="${state.patientPhone}" oninput="updatePatientButton();handlePhoneInput(this.value)"><div class="form-hint">Vei primi SMS de confirmare la acest număr</div><div id="phone-status"></div></div><div class="form-group"><label class="form-label">Email <span class="optional">(opțional)</span></label><input type="email" id="patient-email" class="form-input" placeholder="ex: ion@email.com" value="${state.patientEmail}"></div><button class="btn-primary" id="patient-btn" onclick="goToConfirm()" disabled>Vezi rezumatul</button></div></div>`;}
    function isValidFullName(n){ if(!n)return false; const parts=n.trim().split(/\s+/).filter(p=>p.length>=2); return parts.length>=2; }
    function updatePatientButton(){const n=document.getElementById('patient-name')?.value?.trim(),p=document.getElementById('patient-phone')?.value?.trim(),b=document.getElementById('patient-btn');const nameOk=isValidFullName(n);const ne=document.getElementById('name-hint');if(ne){if(n&&!nameOk){ne.innerHTML='<div class="form-error">Te rugăm introdu numele complet (prenume și nume)</div>';}else{ne.innerHTML='';}}if(b)b.disabled=!nameOk||p?.length<10||!state.phoneCanBook;}
    function updatePhoneStatus(){const el=document.getElementById('phone-status');if(!el)return;if(state.phoneCheckLoading)el.innerHTML=`<div class="phone-status checking">⏳ Se verifică disponibilitatea...</div>`;else if(state.phoneChecked&&!state.phoneCanBook)el.innerHTML=`<div class="phone-status error">❌ Aveți deja o programare activă. Contactați-ne telefonic pentru o nouă programare.</div>`;else if(state.phoneChecked&&state.phoneCanBook&&state.patientPhone.length>=10)el.innerHTML=`<div class="phone-status success">✓ Număr valid</div>`;else el.innerHTML='';updatePatientButton();}
    function goToConfirm(){state.patientName=document.getElementById('patient-name')?.value||'';state.patientPhone=document.getElementById('patient-phone')?.value||'';state.patientEmail=document.getElementById('patient-email')?.value||'';if(!isValidFullName(state.patientName)||state.patientPhone.trim().length<10)return;state.step='confirm';render();}
    function getServiceNotes(){const n=[];if(state.serviceType==='psihiatrie-copil')n.push({title:'📋 Documente necesare',content:`<ul style="margin:8px 0;padding-left:20px;font-size:11px;"><li>Copie certificat naștere și CI/BI copil</li><li>Copii CI/BI ambii părinți</li><li>Dosar medical (dacă există)</li><li>Dacă un părinte lipsește: acord semnat trimis pe mail înainte</li></ul><div style="font-size:11px;margin-top:8px;">📧 Trimite documentele la <strong>office@themind.ro</strong></div>`});if(state.serviceType==='psihoterapie-copil'||state.serviceType==='psihoterapie-adolescent')n.push({title:'👨‍👩‍👧 Prima ședință',content:`<div style="font-size:11px;">La prima ședință vor veni <strong>doar părinții, fără copil</strong>.<br><br>Dacă ambii părinți nu pot fi prezenți, avem nevoie de acordul părintelui absent (inclusiv în cazul părinților divorțați/separați). Anunță-ne în prealabil pentru a trimite formularul.</div>`});if(state.serviceType==='logopedie')n.push({title:'👨‍👩‍👧 Prima ședință',content:`<div style="font-size:11px;">La prima ședință părinții vor însoți copilul pentru a semna acordul informat.<br><br>Dacă ambii părinți nu pot fi prezenți, avem nevoie de acordul părintelui absent. Anunță-ne în prealabil pentru a trimite formularul.</div>`});if(state.serviceType==='psihiatrie-adult')n.push({title:'📋 De adus la consultație',content:`<div style="font-size:11px;">• Carte de identitate / Buletin<br>• Documente medicale de la alți psihiatri (dacă există)</div>`});return n;}
    function renderConfirm(){const doc=state.selectedDoctor,dt=parseDateString(state.selectedDate),dd=`${DAY_NAMES[dt.getDay()]}, ${dt.getDate()} ${MONTHS_RO[dt.getMonth()]} ${dt.getFullYear()}`,sl=SERVICE_TYPES[state.serviceType]?.label||'',ln=state.sessionFormat==='online'?'Online':LOCATIONS[state.locationId]?.name,pr=calculatePrice(state.serviceType,doc.DoctorType,state.language),rs=state.selectedReason==='other'?state.otherReason:state.selectedReason,ns=getServiceNotes();return `<div class="section"><div class="section-header"><button class="back-btn" onclick="goBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="section-title">Confirmare programare</div></div><div class="summary-card"><div class="summary-row"><span class="summary-icon">👤</span><div><div class="summary-label">Specialist</div><div class="summary-value">${doc.Name}</div></div></div>${sl?`<div class="summary-row"><span class="summary-icon">🩺</span><div><div class="summary-label">Serviciu</div><div class="summary-value">${sl}</div></div></div>`:''}${rs?`<div class="summary-row"><span class="summary-icon">📝</span><div><div class="summary-label">Motiv</div><div class="summary-value">${rs}</div></div></div>`:''}<div class="summary-row"><span class="summary-icon">📅</span><div><div class="summary-label">Data și ora</div><div class="summary-value">${dd}, ora ${state.selectedTime.time}</div></div></div><div class="summary-row"><span class="summary-icon">📍</span><div><div class="summary-label">Locație</div><div class="summary-value">${ln||''}</div></div></div><div class="summary-row"><span class="summary-icon">🗣️</span><div><div class="summary-label">Limba</div><div class="summary-value">${state.language||''}</div></div></div><div class="summary-row"><span class="summary-icon">📱</span><div><div class="summary-label">Pacient</div><div class="summary-value">${state.patientName}</div><div style="font-size:11px;color:var(--text-light);">${state.patientPhone}</div></div></div><div class="summary-price"><span class="label">Total de plată</span><span class="amount">${pr} RON</span></div></div>${ns.length>0?ns.map(n=>`<div style="margin-bottom:12px;padding:12px;background:var(--primary-light);border-radius:10px;border-left:3px solid var(--primary);"><div style="font-weight:600;font-size:12px;color:var(--primary);margin-bottom:6px;">${n.title}</div>${n.content}</div>`).join(''):''}<div style="margin-bottom:16px;padding:12px;background:var(--warning-light);border-radius:10px;font-size:11px;color:var(--warning);"><strong>⚠️ Politica de anulare:</strong><br>Dacă ai nevoie să anulezi, te rugăm să ne anunți cu minim 48 de ore înainte, altfel ședința va fi tarifată. Prin programare rezervi timpul unui specialist, o resursă finită și prețioasă.</div><button class="btn-primary" onclick="submitBooking()">Confirmă programarea</button><button class="btn-secondary" onclick="goBack()">Modifică datele</button></div>`;}
    function renderSuccess(){const doc=state.selectedDoctor,dt=parseDateString(state.selectedDate),dd=`${DAY_NAMES[dt.getDay()]}, ${dt.getDate()} ${MONTHS_RO[dt.getMonth()]}`,pp=state.serviceType==='psihiatrie-copil';return `<div class="success-container" style="text-align:left;padding:20px;"><div style="text-align:center;"><div class="success-icon">✅</div><div class="success-title">Programare confirmată!</div><div class="success-message" style="margin-bottom:20px;">Te-ai programat la <strong>${doc.Name}</strong>, <strong>${dd}</strong> la ora <strong>${state.selectedTime.time}</strong>.<br><br>Vei primi un SMS de confirmare la numărul <strong>${state.patientPhone}</strong>.<br><br><span style="color:var(--primary);font-style:italic;">Îți mulțumim că ai ales The Mind. Ai făcut un pas important!</span></div></div>${pp?`<div style="background:var(--primary-light);border-radius:12px;padding:16px;margin-bottom:16px;border-left:4px solid var(--primary);"><div style="font-weight:700;font-size:14px;color:var(--primary);margin-bottom:12px;">📋 Protocol Psihiatrie Pediatrică</div><div style="font-size:12px;margin-bottom:12px;"><strong>1. Documente necesare:</strong><ul style="margin:6px 0;padding-left:18px;"><li>Copie certificat naștere și CI/BI copil</li><li>Copii CI/BI ambii părinți</li><li>Dosar medical / acte medicale (dacă există)</li><li>Părinți divorțați/separați: hotărâre judecătorească</li><li>Părinte decedat: copie certificat deces</li><li>Părinte absent: acord semnat, trimis pe mail înainte</li></ul></div><div style="font-size:12px;margin-bottom:12px;"><strong>2. Trimitere documente:</strong><br>Trimite documentele pe <strong>office@themind.ro</strong> înainte de programare.</div><div style="font-size:12px;margin-bottom:12px;"><strong>3. Tipul ședințelor:</strong><br>• Evaluarea inițială se realizează doar la clinică<br>• Ședințele ulterioare pot fi online (cu acordul medicului)</div><div style="font-size:12px;background:var(--accent-light);padding:10px;border-radi     function renderError(){const et=state.errorType,isSoft=et==='duplicate'||et==='unavailable'||et==='invalid_name',icon=et==='duplicate'?'ℹ️':et==='unavailable'?'📅':et==='invalid_name'?'✏️':'❌',title=et==='duplicate'?'Programare existentă':et==='unavailable'?'Interval indisponibil':et==='invalid_name'?'Nume incomplet':'A apărut o eroare',iconBg=isSoft?'var(--primary-light)':'var(--error-light)',titleColor=isSoft?'var(--primary)':'var(--error)',btnText=et==='duplicate'?'Înțeles':et==='unavailable'?'Alege alt interval':et==='invalid_name'?'Corectează numele':'Începe de la capăt',btnAction=et==='invalid_name'?'goToStep(\'patient-data\')':'resetBooking()';return `<div class="error-container"><div class="error-icon" style="background:${iconBg};">${icon}</div><div class="error-title" style="color:${titleColor};">${title}</div><div class="error-message">${state.errorMessage||'Nu am putut finaliza programarea. Te rugăm contactează-ne telefonic la 021.781.22.59'}</div><button class="btn-primary" onclick="${btnAction}">${btnText}</button><a href="tel:0217812259" class="btn-secondary" style="display:block;text-align:center;text-decoration:none;">📞 Sună: 021.781.22.59</a></div>`;}

    function startSearchFlow(){state.flowType='search';state.step='search';searchDoctors('');render();}
    function startGuidedFlow(){state.flowType='guided';state.step='patient-type';render();}
    function handleSearchInput(v){state.searchQuery=v;searchDoctors(v);render();}
    function selectDoctorFromSearch(id){state.selectedDoctor=state.allDoctors.find(d=>d.DoctorId===id);const specs=(state.selectedDoctor.SpecialtyType||[]).map(s=>s.toLowerCase());if(specs.some(s=>s.includes('psihiatrie pediatric'))){state.serviceType='psihiatrie-copil';state.patientType='child';}else if(specs.some(s=>s.includes('psihiatrie'))){state.serviceType='psihiatrie-adult';state.patientType='adult';}else if(specs.some(s=>s.includes('logoped'))){state.serviceType='logopedie';state.patientType='child';}else if(specs.some(s=>s.includes('psihoterapie adulti'))){state.serviceType='psihoterapie-adult';state.patientType='adult';}else if(specs.some(s=>s.includes('psihoterapie cuplu'))){state.serviceType='psihoterapie-cuplu';state.patientType='adult';}else if(specs.some(s=>s.includes('psihoterapie adolescenti'))){state.serviceType='psihoterapie-adolescent';state.patientType='child';}else if(specs.some(s=>s.includes('psihoterapie copii'))){state.serviceType='psihoterapie-copil';state.patientType='child';}else{state.serviceType='psihoterapie-adult';state.patientType='adult';}if(specs.some(s=>s.includes('psihoterapie')))state.step='search-format';else{state.sessionFormat='cabinet';state.step='search-location';}render();}
    function selectReason(r){state.selectedReason=r;render();}
    function afterSearchReason(){if((state.selectedDoctor.SpecialtyType||[]).some(s=>s.toLowerCase().includes('psihoterapie')))state.step='search-format';else{state.sessionFormat='cabinet';state.step='search-location';}render();}
    function afterGuidedReason(){state.step='doctor';render();}
    function selectSearchFormat(f){state.sessionFormat=f;state.step=f==='online'?'search-language':'search-location';render();}
    function getDoctorLocations(){return String(state.selectedDoctor.LocationIds||'1').split(',').map(s=>s.trim()).map(id=>({id,...LOCATIONS[id]})).filter(l=>l.name);}
    function getDoctorLanguages(){return state.selectedDoctor.Languages||['Romana'];}
    function selectSearchLocation(id){state.locationId=id;state.step='search-language';render();}
    function selectSearchLanguage(l){state.language=l;state.step='calendar';render();}
    function selectPatientType(t){state.patientType=t;state.step='service';render();}
    function selectService(s){state.serviceType=s;state.step='age-group';render();}
    function selectAgeGroup(k,l,mn,mx){state.selectedAgeGroup={key:k,label:l,min:mn,max:mx};if(state.patientType==='child'&&state.serviceType==='psihoterapie-copil'&&k==='14-18')state.serviceType='psihoterapie-adolescent';if(state.serviceType.includes('psihoterapie'))state.step='format';else{state.sessionFormat='cabinet';state.step='location';}render();}
    function selectFormat(f){state.sessionFormat=f;state.step=f==='online'?'language':'location';render();}
    function selectLocation(id){state.locationId=id;state.step='language';render();}
    function selectLanguage(l){state.language=l;state.step='doctor';render();}
    function selectDoctorFromGuided(id){state.selectedDoctor=state.allDoctors.find(d=>d.DoctorId===id);state.step='calendar';render();}
    function selectDate(ds){state.selectedDate=ds;state.selectedTime=null;state.showAllSlots=false;state.step='time';render();}
    function selectTime(t,sd,locId){state.selectedTime={time:t,startDateTime:sd,locationId:locId};render();}
    function goBackFromTime(){state.selectedTime=null;state.step='calendar';render();}
    function toggleAllSlots(){state.showAllSlots=!state.showAllSlots;state.selectedTime=null;render();}
    function prevMonth(){state.currentMonth=new Date(state.currentMonth.getFullYear(),state.currentMonth.getMonth()-1,1);render();}
    function nextMonth(){state.currentMonth=new Date(state.currentMonth.getFullYear(),state.currentMonth.getMonth()+1,1);render();}

    init();
