<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mind - Programare Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #232026; --ink-2: #5E5964; --ink-3: #9A95A0;
      --line: #E9E5E8; --mist: #F6F4F5; --bg: #ffffff;
      --orange: #F56E28; --orange-deep: #C9520F; --orange-soft: #FEF1E9;
      --green: #0E8A62; --green-soft: #E6F7F1;
      --red: #C4121F; --red-soft: #FDECEE;
      --r-lg: 16px; --r-md: 12px; --r-sm: 10px;
      --d1: #964BF9; --d2: #2385F9; --d3: #FF1DBA; --d4: #FF7300; --d5: #05CE95; --d6: #F9C041; --d7: #F40618; --d8: #13841A; --d9: #2385F9;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 8px; }

    .app-container { max-width: 400px; min-height: 420px; margin: 0 auto; padding: 18px 18px 22px; }
    .section { animation: enter .28s ease both; }
    @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* top bar: back + brand dots that fill as the booking advances */
    .top { display: flex; align-items: center; justify-content: space-between; min-height: 36px; margin-bottom: 18px; }
    .back { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-2); background: var(--mist); transition: background .15s, color .15s; }
    .back:hover { background: var(--orange-soft); color: var(--orange-deep); }
    .dots { display: grid; grid-template-columns: repeat(3, 7px); gap: 4px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .35s ease, transform .35s ease; }
    .dots span.on { background: var(--c); }
    .dots.big { grid-template-columns: repeat(3, 14px); gap: 7px; }
    .dots.big span { width: 14px; height: 14px; }
    .dots.pulse span { animation: pulse 1.35s ease-in-out infinite; background: var(--c); opacity: .18; }
    @keyframes pulse { 0%, 100% { opacity: .18; } 40% { opacity: 1; } }

    .title { font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
    .sub { margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
    .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }

    /* option rows */
    .opt { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); transition: border-color .15s, background .15s; }
    .opt:hover { border-color: var(--orange); background: var(--orange-soft); }
    .opt.is-sel { border-color: var(--orange); background: var(--orange-soft); }
    .opt.lead { background: var(--ink); border-color: var(--ink); color: #fff; }
    .opt.lead .opt-desc { color: rgba(255,255,255,.72); }
    .opt.lead .chev { color: rgba(255,255,255,.8); }
    .opt.lead:hover { background: #38333C; border-color: #38333C; }
    .opt-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .opt-title { font-size: 14.5px; font-weight: 500; }
    .opt-desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
    .chev { flex-shrink: 0; color: var(--ink-3); }
    .opt:hover .chev { color: var(--orange-deep); }
    .tick { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; }
    .opt.is-sel .tick { background: var(--orange); border-color: var(--orange); }
    .other-input { flex: 1; border: none; background: transparent; font: inherit; font-size: 14.5px; outline: none; color: var(--ink); }
    .other-input::placeholder { color: var(--ink-3); }

    /* search */
    .search { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 0 14px; height: 48px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--mist); transition: border-color .15s, background .15s; }
    .search:focus-within { border-color: var(--orange); background: var(--bg); }
    .search svg { color: var(--ink-3); flex-shrink: 0; }
    .search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14.5px; color: var(--ink); }
    .search input::placeholder { color: var(--ink-3); }

    /* specialists */
    .doctors-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
    .doc { width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); transition: border-color .15s, background .15s; }
    .doc:hover { border-color: var(--orange); background: var(--orange-soft); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--mist); color: var(--ink-2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; overflow: hidden; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .doc-body { flex: 1; min-width: 0; }
    .doc-name { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
    .doc-bio { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .doc-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 11.5px; line-height: 1; padding: 6px 8px; border-radius: 999px; background: var(--mist); color: var(--ink-2); }
    .tag.free { background: var(--green-soft); color: var(--green); font-weight: 500; }

    .who { display: flex; align-items: center; gap: 12px; padding: 12px; margin-top: 16px; border-radius: var(--r-md); background: var(--mist); }
    .who .avatar { width: 40px; height: 40px; font-size: 13px; background: var(--bg); }
    .who-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .who-detail { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

    /* calendar */
    .cal { margin-top: 16px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .month { font-size: 15px; font-weight: 600; }
    .cal-nav { display: flex; gap: 4px; }
    .nav-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink); transition: background .15s; }
    .nav-btn:hover:not(:disabled) { background: var(--mist); }
    .nav-btn:disabled { color: var(--line); cursor: default; }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekday { text-align: center; font-size: 11.5px; color: var(--ink-3); padding: 4px 0 8px; }
    .days { row-gap: 2px; }
    .day { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13.5px; border-radius: 50%; color: var(--ink-3); }
    .day.available { color: var(--ink); font-weight: 600; cursor: pointer; }
    .day.available::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--orange); }
    .day.available:hover { background: var(--orange-soft); }
    .day.today { box-shadow: inset 0 0 0 1px var(--line); }
    .day.selected { background: var(--orange); color: #fff; }
    .day.selected::after { background: #fff; }
    .day.past { color: #CFCAD2; }
    .cal-key { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
    .cal-key i { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); display: inline-block; }

    /* hours */
    .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .slot { height: 46px; border: 1px solid var(--line); border-radius: var(--r-sm); text-align: center; font-size: 14.5px; font-weight: 500; font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s; }
    .slot:hover { border-color: var(--orange); background: var(--orange-soft); }
    .slot.is-sel { background: var(--orange); border-color: var(--orange); color: #fff; }

    /* form */
    .form { display: flex; flex-direction: column; gap: 18px; margin-top: 18px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 13px; font-weight: 500; color: var(--ink); }
    .form-label .optional { color: var(--ink-3); font-weight: 400; }
    .form-input { height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm); font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); outline: none; transition: border-color .15s, box-shadow .15s; }
    .form-input::placeholder { color: var(--ink-3); }
    .form-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
    .form-hint { font-size: 12px; color: var(--ink-2); }
    .form-error { font-size: 12px; color: var(--red); }
    .phone-status { margin-top: 2px; font-size: 12px; }
    .phone-status.checking { color: var(--ink-2); }
    .phone-status.success { color: var(--green); }
    .phone-status.error { color: var(--red); }

    /* summary */
    .summary { margin-top: 16px; border-radius: var(--r-lg); background: var(--mist); padding: 4px 16px; }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row dt { font-size: 12.5px; color: var(--ink-2); flex-shrink: 0; }
    .row dd { font-size: 13.5px; font-weight: 500; text-align: right; }
    .row dd small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; }
    .row.total dt { color: var(--ink); font-weight: 500; font-size: 13.5px; }
    .row.total dd { font-size: 18px; font-weight: 600; }

    .note { margin-top: 12px; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
    .note strong { color: var(--ink); font-weight: 600; }
    .note-title { display: block; color: var(--ink); font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .note ul { margin: 4px 0 0; padding-left: 18px; }
    .note li + li { margin-top: 2px; }
    .note.accent { border-color: transparent; background: var(--orange-soft); color: var(--ink); }

    /* buttons */
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .btn-primary { width: 100%; height: 50px; border-radius: var(--r-md); background: var(--orange); color: #fff; font-size: 15px; font-weight: 600; text-align: center; transition: background .15s; }
    .btn-primary:hover { background: var(--orange-deep); }
    .btn-primary:disabled { background: var(--line); color: var(--ink-3); cursor: not-allowed; }
    .btn-secondary { width: 100%; height: 48px; border-radius: var(--r-md); border: 1px solid var(--line); color: var(--ink); font-size: 14px; font-weight: 500; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: border-color .15s; }
    .btn-secondary:hover { border-color: var(--ink-3); }

    /* states */
    .center-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 72px 20px; gap: 16px; }
    .loading-text { font-size: 13.5px; color: var(--ink-2); }
    .inline-loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 0; }
    .empty-state { padding: 32px 8px; text-align: center; color: var(--ink-2); font-size: 13.5px; }

    .result { padding-top: 12px; }
    .result .dots { margin-bottom: 22px; }
    .result-title { font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
    .result-text { margin-top: 10px; font-size: 14px; color: var(--ink-2); line-height: 1.65; }
    .result-text strong { color: var(--ink); font-weight: 600; }
    .result-thanks { margin-top: 14px; font-size: 14px; color: var(--ink); }
    .status-mark { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; background: var(--mist); color: var(--ink-2); }
    .status-mark.hard { background: var(--red-soft); color: var(--red); }

    /* reservation pop-up */
    .notice-overlay { position: fixed; inset: 0; background: rgba(35, 32, 38, 0.42); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 1000; animation: fade .2s ease both; }
    .notice-box { width: 100%; max-width: 380px; background: var(--bg); border-radius: 20px; padding: 24px 20px 20px; animation: rise .28s ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .notice-box .dots { margin-bottom: 16px; }
    .notice-title { font-size: 17px; font-weight: 600; line-height: 1.35; }
    .notice-text { margin: 8px 0 20px; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
    @media (min-height: 560px) { .notice-overlay { align-items: center; } }

    .doctors-list::-webkit-scrollbar { width: 4px; }
    .doctors-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .dots.pulse span { opacity: .6; }
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <div class="center-state">
      <div class="loading-text">O secundă...</div>
    </div>
  </div>
  <script>
    const CONFIG = { availabilityWebhook: 'https://hook.eu1.make.com/6nmbzcxoqlfy2gfaagvtfylsq3yiptfh', bookingWebhook: 'https://hook.eu1.make.com/7u9e5kwut77u7bekm8poglrmmlw62cym', phoneCheckWebhook: '' };
    const MONTHS_RO = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
    const DAYS_RO = ['Lu','Ma','Mi','Jo','Vi','Sâ','Du'];
    const DAY_NAMES = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
    function parseDateString(dateStr) { const [y,m,d] = dateStr.split('-').map(Number); return new Date(y, m-1, d); }
    const SERVICE_TYPES = { 'psihoterapie-adult':{label:'Psihoterapie individuală',airtable:'Psihoterapie adulti',api:'Psihoterapie adulti'}, 'psihoterapie-cuplu':{label:'Psihoterapie de cuplu',airtable:'Psihoterapie cuplu',api:'Psihoterapie cuplu'}, 'psihiatrie-adult':{label:'Psihiatrie',airtable:'Psihiatrie adulti',api:'Psihiatrie adulti'}, 'psihoterapie-copil':{label:'Psihoterapie copii',airtable:'Psihoterapie copii',api:'Psihoterapie copii'}, 'psihoterapie-adolescent':{label:'Psihoterapie adolescenți',airtable:'Psihoterapie adolescenti',api:'Psihoterapie adolescenti'}, 'psihiatrie-copil':{label:'Psihiatrie pediatrică',airtable:'Psihiatrie pediatrica',api:'Psihiatrie pediatrica'}, 'logopedie':{label:'Logopedie',airtable:'Logopedie',api:'Logopedie'}, 'evaluare-psihologica':{label:'Evaluare și testare psihologică',airtable:'Evaluare psihologica',api:'Evaluare/testare psihologica'} };
    const LOCATIONS = { '1':{name:'Cotroceni',address:'Strada Ana Davila 13'}, '2':{name:'Primăverii',address:'Strada Pictor Ion Negulici 4'} };
    const AGE_GROUPS_ADULT = [{key:'18-30',label:'18 - 30 ani',min:18,max:30},{key:'30+',label:'Peste 30 ani',min:31,max:99}];
    const AGE_GROUPS_CHILD = [{key:'3-13',label:'3 - 13 ani',min:3,max:13},{key:'14-18',label:'14 - 18 ani',min:14,max:18}];
    const AGE_GROUPS_LOGOPEDIE = [{key:'3-14',label:'3 - 14 ani',min:3,max:14}];
    const AGE_GROUPS_PSIHIATRIE_COPIL = [{key:'0-18',label:'0 - 18 ani',min:0,max:18}];
    const REASONS_ADULT = ['Anxietate / Atacuri de panică','Depresie','Burnout / Stres','Traume emoționale','Relații / Cuplu / Familie','Dezvoltare personală'];
    const REASONS_CHILD = ['Anxietate / Stres','Depresie / Stări emoționale','Tulburări de comportament','Traume emoționale','ADHD / TOC','Tulburări de personalitate'];
    const REASONS_LOGOPEDIE = ['Dificultăți de vorbire/pronunție','Bâlbâială','Dificultăți de auz','Dislexie','Întârzieri în dezvoltare'];
    const SESSION_DURATION = 50;
    const BUFFER_MIN = 10;
    const MIN_SPACING_MIN = 30;
    const HEAD_SLOTS = 2;
    const TAIL_SLOTS = 1;
    // orele se recitesc din MedSoft daca lista din pagina e mai veche de atat
    const SLOTS_MAX_AGE_MS = 60000;

    // ===== REGULI SLOTURI PE SERVICIU =====
    // duration = durata sedintei in minute
    // step     = la cate minute incepe urmatorul slot oferit
    // grid     = ancorare (60 inseamna ca orele pot incepe doar la fix; 30 ar permite si :30)
    // Daca se schimba duratele reale, modifica DOAR numerele de aici.
    const SERVICE_SLOT_RULES = {
      'psihiatrie-adult':        { duration: 50, step: 60, grid: 60 },
      'psihiatrie-copil':        { duration: 50, step: 60, grid: 60 },
      'psihoterapie-adult':      { duration: 50, step: 60, grid: 60 },
      'psihoterapie-cuplu':      { duration: 50, step: 60, grid: 60 },
      'psihoterapie-copil':      { duration: 50, step: 60, grid: 60 },
      'psihoterapie-adolescent': { duration: 50, step: 60, grid: 60 },
      'logopedie':               { duration: 50, step: 60, grid: 60 },
      'evaluare-psihologica':    { duration: 50, step: 60, grid: 60 }
    };
    const DEFAULT_SLOT_RULE = { duration: 50, step: 60, grid: 60 };
    function getRule() { return SERVICE_SLOT_RULES[state.serviceType] || DEFAULT_SLOT_RULE; }

    // ignora intervalele pe care MedSoft le marcheaza ca indisponibile (concedii, blocaje)
    function isBookableSlot(s) { return s.IsAvailable !== 0; }

    function normalizeDoctor(d) { if (d.DoctorId !== undefined) return d; return { DoctorId:d.doctor_id, Name:d.name, Active:d.active, SpecialtyType:d.specialty_type||[], Photo:d.photo, ShortBio:d.short_bio, LocationIds:d.location_ids, AgeGroupMin:d.age_group_min, AgeGroupMax:d.age_group_max, DoctorType:d.doctor_type, ProblemTags:d.problem_tags||[], Languages:d.languages||[] }; }
    function extractDoctors(raw) { if (!raw||!Array.isArray(raw)) return []; if (raw.length>0&&raw[0]&&raw[0].data) return raw.flatMap(i=>i.data||[]).map(normalizeDoctor); return raw.map(normalizeDoctor); }
    function calculatePrice(st,dt,lang) { const e=lang==='Engleza'; if(st==='evaluare-psihologica') return 290; if(st==='psihoterapie-adult'||st==='psihoterapie-copil'||st==='psihoterapie-adolescent') return e?320:290; if(st==='psihoterapie-cuplu') return e?380:320; if(st==='psihiatrie-adult'||st==='psihiatrie-copil') return dt==='Primar'?(e?410:350):(e?360:310); if(st==='logopedie') return e?290:190; return 290; }

    let state = { step:'loading', loading:true, bookingInProgress:false, slotsLoaded:false, allSlots:[], allDoctors:[], filteredDoctors:[], flowType:null, searchQuery:'', patientType:null, serviceType:null, selectedAgeGroup:null, childAge:null, sessionFormat:null, locationId:null, language:null, selectedReason:null, otherReason:'', selectedDoctor:null, selectedDate:null, selectedTime:null, showAllSlots:false, patientName:'', patientPhone:'', patientEmail:'', phoneChecked:false, phoneCanBook:true, phoneCheckLoading:false, currentMonth:new Date(), appointmentId:null, errorMessage:null, errorType:null };

    async function init() { const p=new URLSearchParams(window.location.search); if(p.get('availabilityWebhook'))CONFIG.availabilityWebhook=p.get('availabilityWebhook'); if(p.get('bookingWebhook'))CONFIG.bookingWebhook=p.get('bookingWebhook'); if(p.get('phoneCheckWebhook'))CONFIG.phoneCheckWebhook=p.get('phoneCheckWebhook'); if(window.bookingConfig)Object.assign(CONFIG,window.bookingConfig); await fetchAllData(); }

    async function fetchAllData() {
      state.loading=true; state.step='loading'; render();
      try {
        const supabaseUrl='https://hxqxyeukqipknxdhrdoa.supabase.co/rest/v1/doctors?select=*&active=eq.true';
        const supabaseKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cXh5ZXVrcWlwa254ZGhyZG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MDkyNzMsImV4cCI6MjA5MDM4NTI3M30.uzZsvmeuCL8vJoOzAUa-SwNmpohfJ2uJ4xvSumaEpGg';
        const docResp=await fetch(supabaseUrl,{headers:{'apikey':supabaseKey,'Authorization':'Bearer '+supabaseKey}});
        state.allDoctors=(await docResp.json()).map(normalizeDoctor);
        console.log('Doctors loaded:',state.allDoctors.length);
        state.loading=false; state.step='start'; render();
        await loadSlots(); render();
      } catch(err) { console.error('Init error:',err); if(!state.allDoctors.length){state.loading=false;state.step='error';state.errorMessage='Nu am putut încărca datele. Te rugăm reîncarcă pagina.';render();} }
    }

    // ===== DISPONIBILITATE PROASPATA =====

    function getServiceNotes(){const n=[];if(state.serviceType==='psihiatrie-copil')n.push({title:'Documente necesare',content:`<ul><li>Copie după certificatul de naștere și actul de identitate al copilului</li><li>Copii după actele de identitate ale ambilor părinți</li><li>Dosarul medical, dacă există</li><li>Dacă un părinte nu poate veni: acordul lui semnat, trimis pe email înainte</li></ul><div style="margin-top:6px">Documentele se trimit la <strong>office@themind.ro</strong>.</div>`});if(state.serviceType==='psihoterapie-copil'||state.serviceType==='psihoterapie-adolescent')n.push({title:'Prima ședință',content:`La prima ședință vin <strong>doar părinții, fără copil</strong>. Dacă unul dintre părinți nu poate fi prezent, avem nevoie de acordul lui (și în cazul părinților divorțați sau separați). Anunță-ne din timp și îți trimitem formularul.`});if(state.serviceType==='logopedie')n.push({title:'Prima ședință',content:`La prima ședință părinții vin împreună cu copilul, ca să semneze acordul informat. Dacă unul dintre părinți nu poate fi prezent, avem nevoie de acordul lui. Anunță-ne din timp și îți trimitem formularul.`});if(state.serviceType==='evaluare-psihologica')n.push({title:'Despre evaluare',content:`Aceasta este o ședință inițială. În funcție de testare și de fiecare pacient în parte, evaluarea se poate extinde pe 3 până la 4 ședințe. Îți dăm toate detaliile la recepție sau când te sunăm pentru confirmarea programării. Evaluarea are loc doar la clinică.`});if(state.serviceType==='psihiatrie-adult')n.push({title:'De adus la consultație',content:`<ul><li>Cartea de identitate</li><li>Documente medicale de la alți psihiatri, dacă există</li></ul>`});return n;}
    function renderConfirm(){const doc=state.selectedDoctor,dt=parseDateString(state.selectedDate),dd=`${DAY_NAMES[dt.getDay()]}, ${dt.getDate()} ${MONTHS_RO[dt.getMonth()].toLowerCase()} ${dt.getFullYear()}`,sl=SERVICE_TYPES[state.serviceType]?.label||'',ln=state.sessionFormat==='online'?'Online':LOCATIONS[state.locationId]?.name,pr=calculatePrice(state.serviceType,doc.DoctorType,state.language),rs=state.selectedReason==='other'?state.otherReason:state.selectedReason,ns=getServiceNotes();const row=(k,v)=>`<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`;return `<div class="section">${head('Verifică rezervarea','Uită-te o dată peste detalii înainte să o trimiți.')}<dl class="summary">${row('Specialist',doc.Name)}${sl?row('Serviciu',sl):''}${rs?row('Motiv',rs):''}${row('Data',dd)}${row('Ora',state.selectedTime.time)}${row('Locație',ln||'')}${row('Limba',langLabel(state.language))}${row('Pacient',`${state.patientName}<small>${state.patientPhone}</small>`)}<div class="row total"><dt>Total</dt><dd>${pr} RON</dd></div></dl><div class="note accent">Aceasta este o cerere de rezervare. Te vom contacta în cel mai scurt timp pentru confirmare.</div>${ns.map(n=>`<div class="note"><span class="note-title">${n.title}</span>${n.content}</div>`).join('')}<div class="note"><span class="note-title">Confirmarea prezenței</span>Cu o zi înainte de ședință, te rugăm să ne confirmi prezența printr-un mesaj. Așa putem păstra timpul specialistului pentru tine.</div><div class="note"><span class="note-title">Dacă trebuie să anulezi</span>Anunță-ne cu cel puțin 48 de ore înainte, altfel ședința se tarifează. Prin programare rezervi timpul unui specialist, o resursă finită și prețioasă.</div><div class="actions"><button class="btn-primary" onclick="submitBooking()">Trimite rezervarea</button><button class="btn-secondary" onclick="goBack()">Modifică datele</button></div></div>`;}
    function renderSuccess(){const doc=state.selectedDoctor,dt=parseDateString(state.selectedDate),dd=`${DAY_NAMES[dt.getDay()].toLowerCase()}, ${dt.getDate()} ${MONTHS_RO[dt.getMonth()].toLowerCase()}`,pp=state.serviceType==='psihiatrie-copil';return `<div class="section result">${dots(9,'big')}<h1 class="result-title">Rezervare înregistrată</h1><p class="result-text">Am primit rezervarea ta la <strong>${doc.Name}</strong>, <strong>${dd}</strong>, la ora <strong>${state.selectedTime.time}</strong>.<br><br>Te vom contacta în cel mai scurt timp la <strong>${state.patientPhone}</strong> pentru confirmare. Cu o zi înainte de ședință, te rugăm să ne confirmi prezența printr-un mesaj.</p><p class="result-thanks">Îți mulțumim că ai ales The Mind. Ai făcut un pas important.</p>${state.serviceType==='evaluare-psihologica'?`<div class="note" style="margin-top:20px"><span class="note-title">Despre evaluare</span>Aceasta este o ședință inițială. În funcție de testare și de fiecare pacient în parte, evaluarea se poate extinde pe 3 până la 4 ședințe. Îți dăm toate detaliile când te sunăm pentru confirmare.</div>`:''}${pp?`<div class="note" style="margin-top:20px"><span class="note-title">Ce urmează pentru psihiatria pediatrică</span><ul><li>Copie după certificatul de naștere și actul de identitate al copilului</li><li>Copii după actele de identitate ale ambilor părinți</li><li>Dosarul medical sau actele medicale, dacă există</li><li>Părinți divorțați sau separați: hotărârea judecătorească</li><li>Părinte decedat: copie după certificatul de deces</li><li>Părinte absent: acordul lui semnat, trimis pe email înainte</li></ul><div style="margin-top:8px">Trimite documentele la <strong>office@themind.ro</strong> înainte de programare. Evaluarea inițială are loc doar la clinică; ședințele următoare pot fi online, cu acordul medicului.</div></div><div class="note accent">Programarea se face întotdeauna pe numele copilului.</div>`:''}<div class="actions"><button class="btn-secondary" onclick="resetBooking()">Fă o altă programare</button></div></div>${state.showReservationNotice?`<div class="notice-overlay" onclick="closeReservationNotice()"><div class="notice-box" role="dialog" aria-modal="true" aria-labelledby="notice-title" onclick="event.stopPropagation()">${dots(9)}<div class="notice-title" id="notice-title">Mulțumim, am primit rezervarea</div><div class="notice-text">Aceasta este o rezervare. Pentru confirmare, te vom contacta în cel mai scurt timp.</div><button class="btn-primary" onclick="closeReservationNotice()" autofocus>Am înțeles</button></div></div>`:''}`;}
    function closeReservationNotice(){state.showReservationNotice=false;render();}
    function renderError(){const et=state.errorType,hard=!(et==='duplicate'||et==='unavailable'||et==='invalid_name'||et==='unknown'),icon=et==='unknown'?IC.clock:et==='duplicate'?IC.info:et==='unavailable'?IC.cal:et==='invalid_name'?IC.pen:IC.alert,title=et==='unknown'?'Verificăm rezervarea':et==='duplicate'?'Ai deja o programare':et==='unavailable'?'Ora tocmai s-a ocupat':et==='invalid_name'?'Avem nevoie de numele complet':'Rezervarea nu a putut fi trimisă',btnText=(et==='duplicate'||et==='unknown')?'Am înțeles':et==='unavailable'?'Alege altă oră':et==='invalid_name'?'Corectează numele':'Începe din nou',btnAction=et==='invalid_name'?'goToStep(\'patient-data\')':et==='unavailable'?'chooseOtherSlot()':'resetBooking()';return `<div class="section result"><div class="status-mark ${hard?'hard':''}">${icon}</div><h1 class="result-title">${title}</h1><p class="result-text">${state.errorMessage||'Rezervarea nu a putut fi trimisă. Sună-ne la 021.781.22.59 și o facem împreună.'}</p><div class="actions"><button class="btn-primary" onclick="${btnAction}">${btnText}</button><a href="tel:0217812259" class="btn-secondary">${IC.phone}021.781.22.59</a></div></div>`;}

    function startSearchFlow(){state.flowType='search';state.step='search';searchDoctors('');render();}
    function startGuidedFlow(){state.flowType='guided';state.step='patient-type';render();}
    function handleSearchInput(v){state.searchQuery=v;searchDoctors(v);render();}
    function selectDoctorFromSearch(id){state.selectedDoctor=state.allDoctors.find(d=>d.DoctorId===id);const specs=(state.selectedDoctor.SpecialtyType||[]).map(s=>s.toLowerCase());if(specs.some(s=>s.includes('evaluare psihologic'))){state.serviceType='evaluare-psihologica';state.patientType='adult';}else if(specs.some(s=>s.includes('psihiatrie pediatric'))){state.serviceType='psihiatrie-copil';state.patientType='child';}else if(specs.some(s=>s.includes('psihiatrie'))){state.serviceType='psihiatrie-adult';state.patientType='adult';}else if(specs.some(s=>s.includes('logoped'))){state.serviceType='logopedie';state.patientType='child';}else if(specs.some(s=>s.includes('psihoterapie adulti'))){state.serviceType='psihoterapie-adult';state.patientType='adult';}else if(specs.some(s=>s.includes('psihoterapie cuplu'))){state.serviceType='psihoterapie-cuplu';state.patientType='adult';}else if(specs.some(s=>s.includes('psihoterapie adolescenti'))){state.serviceType='psihoterapie-adolescent';state.patientType='child';}else if(specs.some(s=>s.includes('psihoterapie copii'))){state.serviceType='psihoterapie-copil';state.patientType='child';}else{state.serviceType='psihoterapie-adult';state.patientType='adult';}if(specs.some(s=>s.includes('psihoterapie')))state.step='search-format';else{state.sessionFormat='cabinet';state.step='search-location';}render();}
    function selectReason(r){state.selectedReason=r;render();}
    function afterSearchReason(){if((state.selectedDoctor.SpecialtyType||[]).some(s=>s.toLowerCase().includes('psihoterapie')))state.step='search-format';else{state.sessionFormat='cabinet';state.step='search-location';}render();}
    function afterGuidedReason(){state.step='doctor';render();}
    function selectSearchFormat(f){state.sessionFormat=f;state.step=f==='online'?'search-language':'search-location';render();}
    function getDoctorLocations(){return String(state.selectedDoctor.LocationIds||'1').split(',').map(s=>s.trim()).map(id=>({id,...LOCATIONS[id]})).filter(l=>l.name);}
    function getDoctorLanguages(){return state.selectedDoctor.Languages||['Romana'];}
    function selectSearchLocation(id){state.locationId=id;state.step='search-language';render();}
    function selectSearchLanguage(l){state.language=l;state.step='calendar';render();ensureFreshSlots(SLOTS_MAX_AGE_MS);}
    function selectPatientType(t){state.patientType=t;state.step='service';render();}
    function selectService(s){state.serviceType=s;state.step='age-group';render();}
    function selectAgeGroup(k,l,mn,mx){state.selectedAgeGroup={key:k,label:l,min:mn,max:mx};if(state.patientType==='child'&&state.serviceType==='psihoterapie-copil'&&k==='14-18')state.serviceType='psihoterapie-adolescent';if(state.serviceType.includes('psihoterapie'))state.step='format';else{state.sessionFormat='cabinet';state.step='location';}render();}
    function selectFormat(f){state.sessionFormat=f;state.step=f==='online'?'language':'location';render();}
    function selectLocation(id){state.locationId=id;state.step='language';render();}
    function selectLanguage(l){state.language=l;state.step='doctor';render();ensureFreshSlots(SLOTS_MAX_AGE_MS);}
    function selectDoctorFromGuided(id){state.selectedDoctor=state.allDoctors.find(d=>d.DoctorId===id);state.step='calendar';render();ensureFreshSlots(SLOTS_MAX_AGE_MS);}
    function selectDate(ds){state.selectedDate=ds;state.selectedTime=null;state.showAllSlots=false;state.step='time';render();ensureFreshSlots(SLOTS_MAX_AGE_MS);}
    function selectTime(t,sd,locId){state.selectedTime={time:t,startDateTime:sd,locationId:locId};render();}
    function goBackFromTime(){state.selectedTime=null;state.step='calendar';render();}
    function toggleAllSlots(){state.showAllSlots=!state.showAllSlots;state.selectedTime=null;render();}
    function prevMonth(){state.currentMonth=new Date(state.currentMonth.getFullYear(),state.currentMonth.getMonth()-1,1);render();}
    function nextMonth(){state.currentMonth=new Date(state.currentMonth.getFullYear(),state.currentMonth.getMonth()+1,1);render();}

    init();
  </script>
</body>
</html>
